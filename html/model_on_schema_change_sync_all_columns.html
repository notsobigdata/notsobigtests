<!-- Incremental model with on_schema_change='sync_all_columns' - syncs all columns from source -->
<script type="text/sql" id="on_schema_change_sync_all_columns">
  {{ config(materialized='incremental', incrementalStrategy='merge', uniqueKey='id', on_schema_change='sync_all_columns') }}
  select
    cast(1 as int64) as id,
    'alice' as name
    {% if is_incremental() %}
      , 'new_value' as new_column
    {% endif %}
</script>
