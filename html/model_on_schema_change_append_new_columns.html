<!-- Incremental model with on_schema_change='append_new_columns' - adds new columns to schema -->
<script type="text/sql" id="on_schema_change_append_new_columns">
  {{ config(materialized='incremental', incrementalStrategy='merge', uniqueKey='id', on_schema_change='append_new_columns') }}
  select
    cast(1 as int64) as id,
    'alice' as name
    {% if is_incremental() %}
      , 'new_value' as new_column
    {% endif %}
</script>
