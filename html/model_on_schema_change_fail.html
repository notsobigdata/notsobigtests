<!-- Incremental model with on_schema_change='fail' - fails on schema change -->
<script type="text/sql" id="on_schema_change_fail">
  {{ config(materialized='incremental', incrementalStrategy='merge', uniqueKey='id', on_schema_change='fail') }}
  select
    cast(1 as int64) as id,
    'alice' as name
    {% if is_incremental() %}
      , 'new_value' as new_column
    {% endif %}
</script>
